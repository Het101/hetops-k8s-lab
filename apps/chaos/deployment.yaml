apiVersion: apps/v1
kind: Deployment
metadata: { name: chaos-api, namespace: chaos }
spec:
  replicas: 1
  strategy: { type: Recreate }       # one instance: the experiment lock lives in its memory
  selector: { matchLabels: { app: chaos-api } }
  template:
    metadata: { labels: { app: chaos-api } }
    spec:
      serviceAccountName: chaos-api
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
      - name: chaos-api
        image: ghcr.io/het101/chaos-api
        ports: [{ name: http, containerPort: 8080 }]
        envFrom: [{ secretRef: { name: chaos-secrets } }]
        readinessProbe: { httpGet: { path: /chaos/health, port: http }, periodSeconds: 5 }
        livenessProbe: { httpGet: { path: /chaos/health, port: http }, periodSeconds: 10, failureThreshold: 3 }
        resources:
          requests: { cpu: 50m, memory: 96Mi }
          limits: { cpu: 250m, memory: 192Mi }
        securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
        volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: chaos-api, namespace: chaos }
spec:
  selector: { app: chaos-api }
  ports: [{ name: http, port: 80, targetPort: http }]
