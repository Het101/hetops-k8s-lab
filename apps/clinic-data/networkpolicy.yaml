apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: clinic-data
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]   # postgres needs no outbound traffic, except its proxy to Linkerd (below)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: clinic-data
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: clinic } }
    ports:
    - { protocol: TCP, port: 5432 }
    - { protocol: TCP, port: 4143 }   # mTLS: a meshed client connects to the Linkerd proxy's inbound port
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  namespace: clinic-data
spec:
  podSelector: { matchLabels: { app: postgres } }   # Prometheus scrapes the exporter sidecar
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
    ports: [{ protocol: TCP, port: 9187 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-linkerd, namespace: clinic-data }
spec:
  podSelector: {}                 # the proxy fetches its certificate and policy from the Linkerd control plane
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: linkerd } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns, namespace: clinic-data }
spec:
  podSelector: {}                 # the Linkerd proxy resolves the control plane's names (postgres itself never did)
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      podSelector: { matchLabels: { k8s-app: kube-dns } }
    ports:
    - { protocol: UDP, port: 53 }
    - { protocol: TCP, port: 53 }
