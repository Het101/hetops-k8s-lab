apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
images:
- name: ghcr.io/het101/clinic-api
  newTag: 66f54cc
- name: ghcr.io/het101/clinic-web
  newTag: 66f54cc
patches:                           # overlay-only changes, merged onto the base
