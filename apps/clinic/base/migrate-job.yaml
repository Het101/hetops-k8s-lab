apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: clinic
  annotations:
    argocd.argoproj.io/hook: PreSync                          # run BEFORE anything else is synced
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation # delete last run's Job, then create a fresh one
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: migrate }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: migrate
        image: ghcr.io/het101/clinic-api:66f54cc
        command: [node, api/src/migrate.js]
        envFrom:
        - secretRef: { name: clinic-db }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 250m, memory: 256Mi }
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
