# One ServiceAccount per workload (mTLS track, L5). Linkerd names each pod's certificate after its
# ServiceAccount, so these are the identities postgres can allow. All of them shared "default" before.
# None of these apps call the Kubernetes API, so no API token is mounted (Linkerd uses its own projected token).
apiVersion: v1
kind: ServiceAccount
metadata: { name: api }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: worker }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: nightly-report }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: migrate }        # must exist before the change that uses it: a PreSync hook runs before its own sync
automountServiceAccountToken: false
