# The Change Timeline may read (get/list/watch) workloads, pods and events here. It lives with the clinic app,
# so a namespace nuke + Argo CD restore brings it back together with everything else.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: timeline-reader, namespace: clinic }
subjects: [{ kind: ServiceAccount, name: timeline, namespace: timeline }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: timeline-reader }
