# The Gateway API twin of ingress.yaml. The streams beat every 20 s and send X-Accel-Buffering: no, so nginx's
# defaults suit them. /ingest is still never routed (lab.hetops.dev/ingest lands on the clinic's web page).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: timeline
  namespace: timeline
spec:
  parentRefs: [{ name: lab, namespace: nginx-gateway }]
  hostnames: [lab.hetops.dev]
  rules:
  - matches: [{ path: { type: PathPrefix, value: /timeline } }]
    backendRefs: [{ name: timeline, port: 8080 }]
  - matches: [{ path: { type: PathPrefix, value: /owner/timeline } }]
    backendRefs: [{ name: timeline, port: 8081 }]
