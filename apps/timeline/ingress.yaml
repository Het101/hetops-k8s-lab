# Two doors on lab.hetops.dev. /timeline is public (a Cloudflare Access Bypass app, like /chaos).
# /owner/timeline stays under the default owner-only Access policy. /ingest is never routed: in-cluster only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timeline
  namespace: timeline
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"       # stream events immediately (SSE)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # let a viewer's stream stay open an hour
spec:
  ingressClassName: nginx
  rules:
  - host: lab.hetops.dev
    http:
      paths:
      - path: /timeline
        pathType: Prefix
        backend: { service: { name: timeline, port: { number: 8080 } } }
      - path: /owner/timeline
        pathType: Prefix
        backend: { service: { name: timeline, port: { number: 8081 } } }
