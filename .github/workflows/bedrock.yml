# Bedrock: catch a broken playbook in the PR, and prove it rebuilds the lab server from nothing.
name: bedrock
on:
  pull_request:
    paths: ["bedrock/**", "platform/host/**", "clusters/ops/root.yaml", ".github/workflows/bedrock.yml"]
  push:
    branches: [main]
    paths: ["bedrock/**", "platform/host/**", "clusters/ops/root.yaml", ".github/workflows/bedrock.yml"]
  workflow_dispatch:
  # Weekly, even with no change here: package repos, Calico's manifest URL and the runner image all move
  # under the playbook. The portfolio's "last proven" reads the latest passing run.
  schedule:
    - cron: "17 3 * * 1"           # Mondays 03:17 UTC
permissions:
  contents: read
# The runner builds itself as the lab: its own one-host inventory, never the real fleet (relative to bedrock/).
env:
  ANSIBLE_INVENTORY: tests/ci-inventory.ini
jobs:
  lint:
    runs-on: ubuntu-24.04-arm          # the lab server is arm64
    defaults:
      run:
        working-directory: bedrock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runners ship their own ansible-core (/opt/pipx); a venv first on PATH makes the pinned one run.
      - name: Install Ansible and ansible-lint
        run: |
          python3 -m venv ~/ansible && ~/ansible/bin/pip install -q ansible==14.5.0 ansible-lint==26.10.1
          echo "$HOME/ansible/bin" >> "$GITHUB_PATH"
      - name: The drift check's parser
        run: python3 -m unittest discover -s tests -v
      - name: Syntax check
        run: ansible-playbook site.yml --syntax-check && ansible-playbook upgrade.yml -e @upgrades/1.35.yml --syntax-check && ansible-playbook patch.yml --syntax-check && ansible-playbook reboot.yml --syntax-check
      - name: ansible-lint
        run: ansible-lint site.yml upgrade.yml patch.yml reboot.yml

  # Phase 3: a blank arm64 Ubuntu 24.04 machine, the same playbook as the live server, a one-node
  # cluster at the end. Then a second run must change nothing (idempotence).
  rebuild:
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bedrock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ansible (and the Kubernetes client for kubernetes.core)
        run: |
          python3 -m venv ~/ansible && ~/ansible/bin/pip install -q ansible==14.5.0 kubernetes
          echo "$HOME/ansible/bin" >> "$GITHUB_PATH"
      - name: The pinned Ansible is the one that runs
        run: which ansible-playbook && ansible-playbook --version | head -1
      - name: First run, from a blank machine
        run: |
          start=$(date +%s)
          ansible-playbook site.yml --diff
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Second run changes nothing
        run: |
          ansible-playbook site.yml | tee second-run.log
          grep -E 'changed=0 +unreachable=0 +failed=0' second-run.log
      # A new role reaching a server that is already built: its check mode must not fail before its first
      # install (live run, 21 Oct: the drift timer did). Remove the drift role's units, check, re-apply.
      - name: Check mode works before a role's first install
        run: |
          sudo systemctl disable --now bedrock-drift.timer
          sudo rm -f /etc/systemd/system/bedrock-drift.service /etc/systemd/system/bedrock-drift.timer
          sudo systemctl daemon-reload
          ansible-playbook site.yml --check > check-new-role.log || { tail -n 40 check-new-role.log; exit 1; }
          tail -n 2 check-new-role.log
          ansible-playbook site.yml > /dev/null
      - name: The nightly drift check runs, and finds nothing on a machine the playbook just built
        run: |
          sudo systemctl start bedrock-drift.service
          sudo journalctl -u bedrock-drift.service --no-pager -o cat | tail -n 5 | tee drift.log
          grep -q '^my-workspace: 0 changed, 0 failed' drift.log
          if grep -qE 'FAILED|would change' drift.log; then echo 'the drift check found differences'; exit 1; fi
      - name: The cluster runs a pod, and the audit log is being written
        run: |
          kubectl get nodes -o wide
          kubectl run bedrock-smoke --image=registry.k8s.io/pause:3.10 --restart=Never
          kubectl wait --for=condition=Ready pod/bedrock-smoke --timeout=180s
          sudo test -s /var/log/kubernetes/audit/audit.log
          sudo tail -n 1 /var/log/kubernetes/audit/audit.log | head -c 300; echo
      # Calico's iptables marks stay clear of Tailscale's 0x00ff0000 (sub-project 1, 28 Oct): Felix's mask is set, and
      # no rule Calico writes sets a bit in that range. Felix restarts itself after a mask change, so wait for it.
      - name: Calico's packet marks stay clear of Tailscale's
        run: |
          # the CRD stores the mask as an integer: 0xff000000 reads back as 4278190080
          kubectl get felixconfiguration default -o jsonpath='{.spec.iptablesMarkMask}' | grep -qx "$((0xff000000))"
          for i in $(seq 1 24); do
            bad=$(sudo iptables-save | grep -E '^-A cali-' | grep -oE 'set-xmark 0x[0-9a-f]+/0x[0-9a-f]+' \
              | python3 -c "import sys; print(' '.join(w.split()[1] for w in sys.stdin if any(int(x, 16) & 0xff0000 for x in w.split()[1].split('/'))))")
            if [ -z "$bad" ] && [ "$(sudo iptables-save | grep -c '^-A cali-')" -gt 0 ]; then echo clear; exit 0; fi
            sleep 5
          done
          echo "Calico still sets bits inside 0xff0000: $bad"; exit 1
      # The ops cluster's roles (27 Oct): the runner is also in group ops (tests/ci-inventory.ini).
      - name: Tailscale is installed at the pinned version and its daemon runs (never joined in CI)
        run: |
          want=$(sed -n 's/^tailscale_version: "\(.*\)"/\1/p' roles/tailscale/defaults/main.yml)
          tailscale version | head -n 1 | grep -qx "$want"
          systemctl is-active tailscaled
      # Argo CD is installed and has its app-of-apps. No wait for a sync: Argo CD reads main, CI tests a branch.
      - name: Argo CD runs and follows clusters/ops
        run: |
          kubectl -n argocd rollout status deploy/argocd-server --timeout=300s
          kubectl -n argocd get application root -o jsonpath='{.spec.source.path}' | grep -qx clusters/ops/apps
      - name: Summary
        if: always()
        run: |
          {
            echo "### Bedrock rebuild"
            echo "- blank arm64 Ubuntu 24.04 to a Ready one-node cluster: **${BUILD_SECONDS:-?} s**"
            echo "- second run: $(grep -oE 'changed=[0-9]+' second-run.log 2>/dev/null || echo 'did not run')"
            echo "- kube $(kubectl version -o json 2>/dev/null | jq -r .serverVersion.gitVersion), $(containerd --version | awk '{print $3}')"
          } >> "$GITHUB_STEP_SUMMARY"

  # The next Kubernetes upgrade, rehearsed on a throwaway cluster before it runs on the lab server: build
  # today's cluster, run upgrade.yml (Calico, then Kubernetes), check it still works, then site.yml with the
  # upgrade's values must change nothing (so group_vars can take them as they are). The runner is the
  # inventory's lab group (tests/ci-inventory.ini), so it passes the lab's opt-in: upgrade_lab=true.
  upgrade:
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    # Every step still ahead of the lab, each from the version before it (its upgrade_from_vars). None since
    # 25 Oct (lab and staging on 1.35), so the last step keeps upgrade.yml itself rehearsed; add the next one here.
    strategy:
      fail-fast: false
      matrix:
        upgrade: [upgrades/1.35.yml]
    name: upgrade (${{ matrix.upgrade }})
    env:
      UPGRADE: ${{ matrix.upgrade }}
    defaults:
      run:
        working-directory: bedrock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ansible (and the Kubernetes client for kubernetes.core)
        run: |
          python3 -m venv ~/ansible && ~/ansible/bin/pip install -q ansible==14.5.0 kubernetes
          echo "$HOME/ansible/bin" >> "$GITHUB_PATH"
      - name: The cluster this upgrade starts from
        run: |
          ~/ansible/bin/python -c "import yaml,json; print(json.dumps(yaml.safe_load(open('$UPGRADE'))['upgrade_from_vars']))" > before.json
          ansible-playbook site.yml -e @before.json > build.log || { tail -n 40 build.log; exit 1; }
          kubectl version -o json | jq -r .serverVersion.gitVersion
      - name: Upgrade Calico
        run: ansible-playbook upgrade.yml -e "@$UPGRADE" -e upgrade_lab=true --tags calico
      # The live server's state after the failed apply of 22 Oct: kubeadm already at the target, the cluster
      # not. The upgrade must finish from there.
      - name: Start from a failed apply (kubeadm upgraded, cluster not)
        run: |
          v=$(~/ansible/bin/python -c "import yaml; print(yaml.safe_load(open('$UPGRADE'))['upgrade_kubernetes_package_version'])")
          m=$(~/ansible/bin/python -c "import yaml; print(yaml.safe_load(open('$UPGRADE'))['upgrade_kubernetes_minor'])")
          echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v$m/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list
          sudo apt-get update -qq && sudo apt-get install -y -qq --allow-change-held-packages "kubeadm=$v"
          kubeadm version -o short; kubectl version -o json | jq -r .serverVersion.gitVersion
      - name: Upgrade Kubernetes
        run: |
          start=$(date +%s)
          ansible-playbook upgrade.yml -e "@$UPGRADE" -e upgrade_lab=true --tags kubernetes
          echo "UPGRADE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Running it again changes nothing
        run: |
          ansible-playbook upgrade.yml -e "@$UPGRADE" -e upgrade_lab=true | tee again.log
          grep -E 'changed=0 +unreachable=0 +failed=0' again.log
      - name: The upgraded cluster works, and audit logging survived
        run: |
          kubectl get nodes -o wide
          kubectl -n kube-system get ds calico-node -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
          kubectl run upgrade-smoke --image=registry.k8s.io/pause:3.10 --restart=Never
          kubectl wait --for=condition=Ready pod/upgrade-smoke --timeout=180s
          sudo grep -c -- '--audit-policy-file' /etc/kubernetes/manifests/kube-apiserver.yaml
          sudo tail -n 1 /var/log/kubernetes/audit/audit.log | grep -q upgrade-smoke || sudo tail -n 3 /var/log/kubernetes/audit/audit.log | head -c 400
      - name: site.yml with the upgrade's values describes the upgraded machine
        run: |
          ~/ansible/bin/python -c "import yaml,json,sys; u=yaml.safe_load(open('$UPGRADE')); print(json.dumps({'kubernetes_minor': u['upgrade_kubernetes_minor'], 'kubernetes_package_version': u['upgrade_kubernetes_package_version'], 'cluster_calico_version': u['upgrade_calico_version']}))" > after.json
          ansible-playbook site.yml -e @after.json | tee site-after.log
          grep -E 'changed=0 +unreachable=0 +failed=0' site-after.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### Bedrock upgrade rehearsal ($UPGRADE)"
            echo "- Kubernetes upgrade: **${UPGRADE_SECONDS:-?} s**"
            echo "- now: $(kubectl version -o json 2>/dev/null | jq -r .serverVersion.gitVersion), Calico $(kubectl -n kube-system get ds calico-node -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | cut -d: -f2)"
          } >> "$GITHUB_STEP_SUMMARY"
