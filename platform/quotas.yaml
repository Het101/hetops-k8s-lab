apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: clinic-data
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 1Gi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "3"
    persistentvolumeclaims: "1"     # exactly one disk: Postgres
    requests.storage: 2Gi           # NEW: total disk space all PVCs together may ask for
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: clinic-data
spec:
  limits:
  - type: Container
    default:
      cpu: 250m
      memory: 256Mi
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    max:
      cpu: "1"
      memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: chaos
spec:
  hard:
    requests.cpu: 250m
    requests.memory: 256Mi
    limits.cpu: 500m
    limits.memory: 256Mi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: chaos
spec:
  limits:
  - type: Container
    default:
      cpu: 100m
      memory: 128Mi
    defaultRequest:
      cpu: 25m
      memory: 64Mi
    max:
      cpu: 500m
      memory: 256Mi
