apiVersion: v1
kind: ResourceQuota            # the ceiling for the WHOLE namespace, all pods added together
metadata:
  name: budget
  namespace: clinic            # quotas live inside the namespace they limit
spec:
  hard:
    requests.cpu: "2"          # all pods' CPU requests together can't exceed 2 CPUs
    requests.memory: 3Gi       # all memory requests together: 3 GiB
    limits.cpu: "4"            # CPU limits can be higher: CPU over the limit is only throttled
    limits.memory: 3Gi         # memory limits: going over gets a pod killed, so keep this honest
    pods: "20"                 # at most 20 pods at once
    persistentvolumeclaims: "0"   # no disks in clinic; data lives in clinic-data
---
apiVersion: v1
kind: LimitRange               # rules for EACH container
metadata:
  name: defaults
  namespace: clinic
spec:
  limits:
  - type: Container
    default:                   # the limit a container gets if it doesn't set one
      cpu: 250m                # 250 millicores = a quarter of one CPU
      memory: 256Mi
    defaultRequest:            # the request a container gets if it doesn't set one
      cpu: 50m
      memory: 64Mi
    max:                       # the most any single container may ask for
      cpu: "1"
      memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: clinic-data
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 1Gi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "3"
    persistentvolumeclaims: "1"     # exactly one disk: Postgres
    requests.storage: 2Gi           # NEW: total disk space all PVCs together may ask for
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: clinic-data
spec:
  limits:
  - type: Container
    default:
      cpu: 250m
      memory: 256Mi
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    max:
      cpu: "1"
      memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: budget
  namespace: chaos
spec:
  hard:
    requests.cpu: 250m
    requests.memory: 256Mi
    limits.cpu: 500m
    limits.memory: 256Mi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: chaos
spec:
  limits:
  - type: Container
    default:
      cpu: 100m
      memory: 128Mi
    defaultRequest:
      cpu: 25m
      memory: 64Mi
    max:
      cpu: 500m
      memory: 256Mi
