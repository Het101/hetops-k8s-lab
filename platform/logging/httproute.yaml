# The Gateway API twin of ingress.yaml (owner-only behind Cloudflare Access, like the Ingress).
# This app syncs with ServerSideApply, which keeps no last-applied record, and Argo CD 3.5.4 then reported the fields
# the API server fills in (weight 1, kind Service, the parentRef's group) as drift, server-side diff or not (22 Oct).
# Client-side apply, as the other three routes use, records last-applied and compares cleanly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kibana
  namespace: logging
  annotations: { argocd.argoproj.io/sync-options: ServerSideApply=false }
spec:
  parentRefs: [{ name: lab, namespace: nginx-gateway }]
  hostnames: [kibana.hetops.dev]
  rules:
  - matches: [{ path: { type: PathPrefix, value: / } }]
    backendRefs: [{ name: lab-kibana-kb-http, port: 5601 }]
