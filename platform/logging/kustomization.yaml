apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- elasticsearch.yaml
- kibana.yaml
- filebeat.yaml
- ops-filebeat.yaml
- sealed-ops-shipper.yaml
- httproute.yaml
configMapGenerator:
