# Second Filebeat, one per node, shipping container logs from the lab namespaces only (never Coolify or anything else on the VM).
# Adapted from ECK's filebeat_autodiscover recipe (v3.5.0): templates with a namespace condition instead of hints,
# no hostNetwork, read-only mounts, containerd paths only.
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: ops-filebeat
  namespace: logging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: filebeat
  version: 9.5.5
  config:
    # The API server audit log (SIEM T1), written on the node by kube-apiserver. One JSON event per line,
    # decoded under k8s_audit.* so it cannot clash with Filebeat's own fields.
    filebeat.inputs:
    - type: filestream
      id: k8s-audit
      paths: [/var/log/kubernetes/audit/audit.log]
      parsers: [{ ndjson: { target: k8s_audit, add_error_key: true } }]
      fields: { log_source: k8s-audit }
      fields_under_root: true
      processors:
      # Normalise to ECS so the SIEM can show and correlate who/where (user.name, source.ip) like any other source.
      - script:
          lang: javascript
          source: |
            function process(event) {
              var user = event.Get("k8s_audit.user.username");
              if (user) event.Put("user.name", user);
              var ips = event.Get("k8s_audit.sourceIPs");
              if (ips && ips.length) event.Put("source.ip", ips[0]);
              var ns = event.Get("k8s_audit.objectRef.namespace");
              if (ns) event.Put("orchestrator.namespace", ns);
              var verb = event.Get("k8s_audit.verb");
              if (verb) event.Put("event.action", verb);
            }
    filebeat.autodiscover.providers:
    - type: kubernetes
      node: ${NODE_NAME}
      templates:
      - condition:
          or:
          - equals: { kubernetes.namespace: clinic }
          - equals: { kubernetes.namespace: clinic-data }
          - equals: { kubernetes.namespace: chaos }
          - equals: { kubernetes.namespace: nginx-gateway }
          - equals: { kubernetes.namespace: timeline }      # missing until 22 Oct (found while writing the field guide)
          - equals: { kubernetes.namespace: falco }
          - equals: { kubernetes.namespace: crowdsec }
        config:
        - type: filestream
          id: lab-${data.kubernetes.pod.name}-${data.kubernetes.container.id}
          paths: ["/var/log/containers/*${data.kubernetes.container.id}.log"]
          parsers: [{ container: {} }]
          prospector.scanner: { fingerprint.enabled: true, fingerprint.length: 64, symlinks: true }   # 64 B: quiet containers still ship
          file_identity.fingerprint: {}
    processors:
    # The Fastify apps log JSON; decode it under app.* so it cannot clash with Filebeat's own fields. nginx lines stay text.
    - decode_json_fields:
        fields: [message]
        target: app
        process_array: false
        max_depth: 2
        add_error_key: false
        when.not.equals: { kubernetes.namespace: falco }
    # Falco's JSON uses the same names with other types (time is a string there, a number in the apps),
    # so it gets its own prefix; sharing app.* would make Elasticsearch reject one side.
    - decode_json_fields:
        fields: [message]
        target: falco
        process_array: false
        max_depth: 3
        add_error_key: false
        when.equals: { kubernetes.namespace: falco }
    # Ships to Elasticsearch on hetops-3 over Tailscale (sub-project 2). The user can only add documents to
    # logs-lab-*; the templates, retention and snapshots are set on hetops-3, so Filebeat sets up nothing.
    setup.template.enabled: false
    setup.ilm.enabled: false
    output.elasticsearch:
      hosts: ["https://100.89.67.82:9200"]
      username: ${OPS_ES_USERNAME}
      password: ${OPS_ES_PASSWORD}
      ssl.certificate_authorities: [/etc/ops-es-ca/ca.crt]
      index: logs-lab-default
      indices:
        - index: logs-lab-security
          when.or:
            - equals: { log_source: k8s-audit }
            - equals: { kubernetes.namespace: falco }
            - equals: { kubernetes.namespace: crowdsec }
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        containers:
        - name: filebeat
          securityContext: { runAsUser: 0 }   # the node's log files are root-owned
          env:
          - name: NODE_NAME
            valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          - name: OPS_ES_USERNAME
            valueFrom: { secretKeyRef: { name: ops-shipper, key: username } }
          - name: OPS_ES_PASSWORD
            valueFrom: { secretKeyRef: { name: ops-shipper, key: password } }
          resources:
            requests: { cpu: 50m, memory: 100Mi }
            limits: { memory: 250Mi }
          volumeMounts:
          - { name: varlogcontainers, mountPath: /var/log/containers, readOnly: true }
          - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
          - { name: ops-es-ca, mountPath: /etc/ops-es-ca, readOnly: true }
          - { name: k8s-audit, mountPath: /var/log/kubernetes/audit, readOnly: true }
        volumes:
        - { name: varlogcontainers, hostPath: { path: /var/log/containers } }
        - { name: varlogpods, hostPath: { path: /var/log/pods } }
        - { name: ops-es-ca, configMap: { name: ops-es-ca } }
        - { name: k8s-audit, hostPath: { path: /var/log/kubernetes/audit, type: DirectoryOrCreate } }
        # ECK also adds a beat-data hostPath (/var/lib/logging/ops-filebeat/filebeat-data) for the read positions; see docs/gameday.md.
---
# Its identity. Moved here from filebeat.yaml when the lab ELK was removed (31 Oct); the names are kept, so nothing is recreated.
apiVersion: v1
kind: ServiceAccount
metadata: { name: filebeat, namespace: logging }
---
# Read-only: autodiscover needs pod, node and namespace metadata (plus owners) to label each log line.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: lab-filebeat }
rules:
- { apiGroups: [""], resources: [namespaces, pods, nodes], verbs: [get, list, watch] }
- { apiGroups: [apps], resources: [replicasets], verbs: [get, list, watch] }
- { apiGroups: [batch], resources: [jobs], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: lab-filebeat }
subjects: [{ kind: ServiceAccount, name: filebeat, namespace: logging }]
roleRef: { kind: ClusterRole, name: lab-filebeat, apiGroup: rbac.authorization.k8s.io }
