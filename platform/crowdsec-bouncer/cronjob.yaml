# Runs the bouncer every 2 minutes: a ban reaches Cloudflare's edge within about 2 minutes. It writes the WAF rule
# through the Rulesets API (normal limits) and only when the ban set changed.
apiVersion: batch/v1
kind: CronJob
metadata: { name: cloudflare-bouncer, namespace: crowdsec }
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 21600   # a failed run (a Cloudflare timeout) is gone after 6 h, so KubeJobFailed clears on its own
      activeDeadlineSeconds: 50
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
          containers:
          - name: bouncer
            image: node:22-alpine
            command: [node, /bouncer/bouncer.mjs]
            env:
            # https since 25 Oct (the LAPI's mTLS). The API key still signs the bouncer in; Node trusts the chart's CA
            # through NODE_EXTRA_CA_CERTS (ca.crt of the bouncer certificate cert-manager issues).
            - { name: LAPI_URL, value: https://crowdsec-service.crowdsec:8080 }
            - { name: NODE_EXTRA_CA_CERTS, value: /etc/ssl/crowdsec-bouncer/ca.crt }
            - { name: ALLOW, value: "140.245.13.138" }   # this server: tests and status checks come from here
            envFrom: [{ secretRef: { name: cloudflare-bouncer } }]   # LAPI_KEY, CF_TOKEN, CF_ZONE
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 96Mi }
            securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
            volumeMounts:
            - { name: script, mountPath: /bouncer }
            - { name: lapi-ca, mountPath: /etc/ssl/crowdsec-bouncer, readOnly: true }
          volumes:
          - { name: script, configMap: { name: cloudflare-bouncer } }
          - { name: lapi-ca, secret: { secretName: crowdsec-bouncer-tls, items: [{ key: ca.crt, path: ca.crt }] } }
