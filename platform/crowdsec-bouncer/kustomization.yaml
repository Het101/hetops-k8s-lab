apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crowdsec
resources:
- cronjob.yaml
- sealed-cloudflare-bouncer.yaml   # LAPI_KEY, CF_TOKEN, CF_ZONE (sealed by the owner)
- sealed-crowdsec-lapi-pinned.yaml   # the LAPI's csLapiSecret + registrationToken, read by the chart (argo/apps/crowdsec.yaml)
configMapGenerator:
- name: cloudflare-bouncer
  files: [bouncer.mjs]
generatorOptions: { disableNameSuffixHash: true }
