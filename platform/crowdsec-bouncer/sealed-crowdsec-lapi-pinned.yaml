# The CrowdSec LAPI's signing secret (csLapiSecret) and agent registration token, pinned (24 Oct).
# Left to the chart, they come from randAlphaNum: the chart's lookup() of the existing Secret returns nothing
# under Argo CD (helm template), so every time Argo's 24 h chart cache expired the Secret changed, its checksum
# annotation changed, and the LAPI pod was replaced (daily at about 10:41 UTC), failing a bouncer run each time.
# Sealed from the live values, so pinning rotated nothing. Rotate: seal new values under this name, then restart LAPI.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: crowdsec-lapi-pinned
  namespace: crowdsec
  annotations: { argocd.argoproj.io/sync-wave: "-1" }   # before the LAPI and agent that read it
spec:
  encryptedData:
    csLapiSecret: 
    registrationToken: 
  template:
    metadata:
      name: crowdsec-lapi-pinned
      namespace: crowdsec
    type: Opaque
