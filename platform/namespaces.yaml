apiVersion: v1
kind: Namespace
metadata:
  name: clinic-data
  annotations:
    linkerd.io/inject: enabled      # mTLS track: every new pod here gets a Linkerd proxy
  labels:
    app.kubernetes.io/part-of: chaos-lab
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos
  annotations:
    linkerd.io/inject: enabled      # mTLS track: every new pod here gets a Linkerd proxy
  labels:
    app.kubernetes.io/part-of: chaos-lab
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/part-of: chaos-lab
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
