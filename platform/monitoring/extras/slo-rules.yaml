# The lab SLO: 99% of synthetic visits good over 7 days (docs/superpowers/specs/2026-10-09-slo-alerts-design.md).
# Recording rules precompute the share of BAD visits over several windows, so dashboards and alerts stay cheap.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: lab-slo, namespace: monitoring }
spec:
  groups:
  - name: lab-slo-sli
    interval: 30s
    rules:
    - record: lab:visits_bad:ratio_rate5m
      expr: (sum(rate(chaos_visits_total{result="bad"}[5m])) or vector(0)) / sum(rate(chaos_visits_total[5m]))
    - record: lab:visits_bad:ratio_rate30m
      expr: (sum(rate(chaos_visits_total{result="bad"}[30m])) or vector(0)) / sum(rate(chaos_visits_total[30m]))
    - record: lab:visits_bad:ratio_rate1h
      expr: (sum(rate(chaos_visits_total{result="bad"}[1h])) or vector(0)) / sum(rate(chaos_visits_total[1h]))
    - record: lab:visits_bad:ratio_rate6h
      expr: (sum(rate(chaos_visits_total{result="bad"}[6h])) or vector(0)) / sum(rate(chaos_visits_total[6h]))
    - record: lab:visits_bad:ratio_rate1d
      expr: (sum(rate(chaos_visits_total{result="bad"}[1d])) or vector(0)) / sum(rate(chaos_visits_total[1d]))
    - record: lab:visits_bad:ratio_rate3d
      expr: (sum(rate(chaos_visits_total{result="bad"}[3d])) or vector(0)) / sum(rate(chaos_visits_total[3d]))
    - record: lab:visits_bad:ratio_rate7d
      expr: (sum(rate(chaos_visits_total{result="bad"}[7d])) or vector(0)) / sum(rate(chaos_visits_total[7d]))
  # Budget and burn rates, built on the ratios above. 0.01 = the 1% error budget (99% SLO).
  - name: lab-slo-budget
    interval: 30s
    rules:
    - record: lab:slo_budget_remaining   # 1 = untouched, 0 = all spent, below 0 = SLO broken
      expr: 1 - lab:visits_bad:ratio_rate7d / 0.01
    - record: lab:slo_burn_rate          # 1 = spending exactly the budget over 7 days
      expr: lab:visits_bad:ratio_rate5m / 0.01
      labels: { window: 5m }
    - record: lab:slo_burn_rate
      expr: lab:visits_bad:ratio_rate30m / 0.01
      labels: { window: 30m }
    - record: lab:slo_burn_rate
      expr: lab:visits_bad:ratio_rate1h / 0.01
      labels: { window: 1h }
    - record: lab:slo_burn_rate
      expr: lab:visits_bad:ratio_rate6h / 0.01
      labels: { window: 6h }
  # Alerts. Only team=lab alerts reach Telegram (see alertmanager.config in values.yaml).
  # One experiment or one namespace nuke stays below every threshold; ~20 experiments in an hour does not.
  - name: lab-slo-alerts
    rules:
    # Two windows must agree: the long one proves it matters, the short one proves it is still happening.
    # The windows carry different `window` labels, so `and` must ignore that label or nothing ever matches.
    - alert: SLOBurnFast
      expr: lab:slo_burn_rate{window="1h"} > 14.4 and ignoring(window) lab:slo_burn_rate{window="5m"} > 14.4
      labels: { team: lab, severity: critical }
      annotations:
        summary: "Error budget burning fast: {{ $value | printf \"%.1f\" }}x over 1h"
        description: "At this pace the whole 7-day budget is gone in under 12 hours. Check the Clinic lab — SLO dashboard."
    - alert: SLOBurnSlow
      expr: lab:slo_burn_rate{window="6h"} > 6 and ignoring(window) lab:slo_burn_rate{window="30m"} > 6
      labels: { team: lab, severity: warning }
      annotations:
        summary: "Error budget burning steadily: {{ $value | printf \"%.1f\" }}x over 6h"
        description: "At this pace the 7-day budget is gone in about a day."
    - alert: SLOBudgetExhausted
      expr: lab:slo_budget_remaining < 0
      for: 10m
      labels: { team: lab, severity: warning }
      annotations:
        summary: "The 99% / 7-day SLO is broken (budget {{ $value | humanizePercentage }})"
        description: "More than 1% of visits in the last 7 days were bad."
    # Symptom alerts above say users are hurting; this cause alert says why. `for: 3m` lets a normal
    # kill-postgres (about 30-60 s) heal on its own without paging.
    - alert: DatabaseUnreachable
      expr: (max(pg_up{job="postgres"}) or vector(0)) == 0
      for: 3m
      labels: { team: lab, severity: critical }
      annotations:
        summary: "Postgres has been unreachable for 3 minutes"
        description: "pg_up is 0 or the exporter is gone. A kill-postgres should heal in about a minute; this one has not."
    - alert: LabNotHealing
      expr: sum(increase(chaos_experiments_total{status=~"timeout|error|action-failed"}[1h])) > 0
      labels: { team: lab, severity: warning }
      annotations:
        summary: "A chaos experiment did not recover in the last hour"
        description: "Open the Chaos experiments dashboard: the lab's self-healing failed at least once."
    # Without the SLI every alert above goes silent, which looks exactly like "all good".
    - alert: SLIMissing
      expr: absent(chaos_visits_total)
      for: 10m
      labels: { team: lab, severity: critical }
      annotations:
        summary: "No SLI data for 10 minutes"
        description: "chaos-api's prober is down or not scraped, so the SLO alerts cannot fire."
