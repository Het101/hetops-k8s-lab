# prometheus.hetops.dev, owner-only behind Cloudflare Access (like Grafana and Kibana). Prometheus has no login of
# its own, so the Access application must exist BEFORE the tunnel route that points here. Every field the API
# server would default is written out: this app applies server-side (see grafana-httproute.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: prometheus, namespace: monitoring }
spec:
  parentRefs: [{ group: gateway.networking.k8s.io, kind: Gateway, name: lab, namespace: nginx-gateway }]
  hostnames: [prometheus.hetops.dev]
  rules:
  - matches: [{ path: { type: PathPrefix, value: / } }]
    backendRefs: [{ group: "", kind: Service, name: kps-kube-prometheus-stack-prometheus, port: 9090, weight: 1 }]
