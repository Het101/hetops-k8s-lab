# HetOps Control's lab agent (argo/apps/control-agent.yaml). No top-level `namespace:`: rbac.yaml puts a Role in
# argocd, which kustomize would otherwise move into control. The secrets are sealed for namespace control only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
  - sealed-agent-token.yaml
  - sealed-agent-tls.yaml
  - sealed-agent-crowdsec.yaml      # the CrowdSec bouncer key (read-only)
  - sealed-agent-coolify.yaml       # the Coolify API token (read-only)
  - sealed-agent-coolify-deploy.yaml   # the Coolify deploy-only token
  - argo-guard.yaml                 # admission policy on the agent's Argo patches
  - crowdsec-ca.yaml
  - agent.yaml
  - networkpolicy.yaml
