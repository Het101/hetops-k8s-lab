# The lab agent: reads this cluster and serves it to the center on hetops-3 over HTTPS, reachable only over
# Tailscale: the hostPort is bound to the lab's Tailscale address, so the CNI forwards 7443 only for traffic to
# 100.93.151.22 (and the tailnet policy lets only tag:ops in); the public IP gets nothing. Its certificate
# (IP:100.93.151.22) is signed by the ops CA the center trusts. No Service: nothing in the cluster calls it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-agent
  namespace: control
spec:
  replicas: 1
  strategy: { type: Recreate }          # one hostPort, one pod: never two at once
  selector:
    matchLabels: { app: control-agent }
  template:
    metadata:
      labels: { app: control-agent }
    spec:
      serviceAccountName: control-agent
      automountServiceAccountToken: true   # the agent is a Kubernetes API client (rbac.yaml)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          # hetops-control main 8b746127a0b45916a72ee4a7262eaef12d9ac09c (the same image as the ops agent)
          image: ghcr.io/het101/hetops-control-agent@sha256:9a64689faa832d5c64e91b8eb81033115ed7daa7dae86a56d8dd901316101559
          env:
            - { name: SERVER, value: lab }
            - { name: AGENT_TOKEN_FILE, value: /secrets/token/token }
            - { name: TLS_CERT_FILE, value: /secrets/tls/tls.crt }
            - { name: TLS_KEY_FILE, value: /secrets/tls/tls.key }
            # The lab sources (hetops-control apps/agent/src/sources): each runs only when its setting is here. All read-only.
            - { name: ALERTMANAGER_URL, value: "http://kps-kube-prometheus-stack-alertmanager.monitoring.svc:9093" }
            - { name: CHAOS_URL, value: "http://chaos-api.chaos.svc" }                 # GET /chaos/status: the error budget
            - { name: TIMELINE_URL, value: "http://timeline.timeline.svc:8081" }       # the owner port: GET /owner/timeline
            # The LAPI's certificate names crowdsec-service.crowdsec; it is signed by the crowdsec CA (crowdsec-ca.yaml).
            - { name: CROWDSEC_URL, value: "https://crowdsec-service.crowdsec:8080" }
            - { name: CROWDSEC_KEY_FILE, value: /secrets/crowdsec/key }
            - { name: CROWDSEC_CA_FILE, value: /etc/crowdsec-ca/ca.crt }
            - { name: BEDROCK_DIR, value: /bedrock }
          ports:
            - { name: https, containerPort: 7443, hostPort: 7443, hostIP: 100.93.151.22 }
          volumeMounts:
            - { name: token, mountPath: /secrets/token, readOnly: true }
            - { name: tls, mountPath: /secrets/tls, readOnly: true }
            - { name: crowdsec, mountPath: /secrets/crowdsec, readOnly: true }
            - { name: crowdsec-ca, mountPath: /etc/crowdsec-ca, readOnly: true }
            - { name: bedrock, mountPath: /bedrock, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: token
          secret: { secretName: control-agent-token }
        - name: tls
          secret: { secretName: control-agent-tls }
        - name: crowdsec                    # a bouncer key (cscli bouncers add hetops-control): it can only read decisions
          secret: { secretName: control-agent-crowdsec }
        - name: crowdsec-ca
          configMap: { name: control-agent-crowdsec-ca }
        # Bedrock's nightly drift results, one file per server ("clean" or "drift"), written by bedrock-drift.timer as ubuntu
        # (0644, readable by the agent's uid). Mounted read-only; a hostPath is the second exception to "restricted" (warned).
        # The lab is one node, so the pod always lands where the files are.
        - name: bedrock
          hostPath: { path: /home/ubuntu/.local/state/bedrock/hosts, type: Directory }
