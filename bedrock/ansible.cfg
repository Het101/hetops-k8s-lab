# Bedrock: the fleet under the lab, as code (bedrock/README.md; design: docs/superpowers/specs/2026-10-21-bedrock-design.md).
# Run from this folder: ansible reads ansible.cfg from the current directory.
[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
# Facts only as ansible_facts['x'], the way ansible-core 2.24 will require (top-level ansible_x is deprecated).
inject_facts_as_vars = False
