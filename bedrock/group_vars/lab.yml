# The lab: production, and the control node itself (a local connection). Versions every Kubernetes node
# shares live in group_vars/k8s.yml; this file holds only what is different about the lab.

# Where Ansible's kubernetes.core modules run, and as whom (option A, 25 Oct: each node manages its own
# cluster). The lab IS the controller, so: the controller's Python (Ansible's own venv has the Kubernetes
# client) and the kubeconfig of the user running ansible-playbook, exactly as before the fleet.
bedrock_api_python: "{{ ansible_playbook_python }}"
bedrock_kube_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
bedrock_kube_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
