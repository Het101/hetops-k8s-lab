# Every Kubernetes node: the lab (production) and staging run the SAME versions (group k8s, 25 Oct). Staging
# mirrors production by construction: one file, not two copies. Written down from the lab's discovery (Phase 1
# step 3, Phase 3 step 1): on a live node these describe it (check mode: changed=0); on a blank one they build it.

# The kube packages, held. Discovery, 21 Oct: 1.31.14. Upgraded 22 Oct to 1.32 (upgrades/1.32.yml), then on
# 25 Oct through 1.33, 1.34 (etcd 3.6) and 1.35: CI, then staging, then the lab. Upgrading is one minor at a
# time: a new upgrades/<minor>.yml, staging and ops first (pinned in staging.yml and ops.yml while ahead), then these values.
kubernetes_minor: "1.35"
kubernetes_package_version: "1.35.9-1.1"

# The one containerd, shared with Coolify's Docker (namespaces moby and k8s.io). Held.
containerd_package_version: "2.2.3-1~ubuntu.24.04~noble"

# The cluster, as kubeadm-config and kube-system show it. Calico from the plain manifest (no Tigera
# operator), whose default pool is this pod subnet. 3.27.0 until 22 Oct, 3.29.7 (upgrades/1.32.yml), then
# 3.31.7 on 25 Oct (upgrades/1.33.yml; tested on 1.32-1.35, so 1.36 will need Calico 3.32).
cluster_pod_subnet: 192.168.0.0/16
cluster_calico_version: v3.31.7
# Calico's iptables mark bits (28 Oct, outside-watcher addendum). Felix's default mask 0xffff0000 includes 0x80000, which
# Calico puts on every packet leaving a pod; Tailscale reserves 0x80000 ("never through the tunnel": fwmark
# 0x80000/0xff0000 lookup main), so pods could not reach the tailnet. 0xff000000 is Calico's minimum of 8 bits, clear of
# Tailscale (0x00ff0000), kube-proxy (0x4000, 0x8000) and the CNI port mapper (0x2000).
cluster_calico_iptables_mark_mask: "0xff000000"


# The Python Kubernetes API client Ansible's kubernetes.core modules use: the lab's (pipx inject ansible
# kubernetes, 37.0.1 on 25 Oct), so a node with its own venv runs the same one.
kubernetes_api_client_version: "37.0.1"
