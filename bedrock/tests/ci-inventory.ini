# CI's inventory: the runner builds itself as the lab and never reaches the real fleet (no keys, no SSH).
# Selected with ANSIBLE_INVENTORY in .github/workflows/bedrock.yml. The k8s parent group must match the
# real inventory's, or the runner would miss group_vars/k8s.yml (every version it installs).
[lab]
my-workspace ansible_connection=local

[k8s:children]
lab

# The ops cluster's roles (tailscale, argocd) are rehearsed on the same runner.
[ops:children]
lab
