# Argo CD on every cluster (ops 27 Oct, staging 31 Oct; the lab's, installed by hand on 8 Oct, adopted 31 Oct),
# installed the way roles/cluster installs Calico: only where missing, from the release manifest at the written-down
# version. Then its settings (defaults/main.yml, lab.yml), and pointed at its folder in this repo
# (argocd_root, group_vars); from there git owns what runs on the cluster. API tasks run on the node, with the node's
# kubeconfig (option A).

# Directories the host layer owns for that cluster's workloads (argocd_state_dirs, group_vars/ops.yml): non-root pods
# with hostPath volumes, where fsGroup does not apply. Only the directories: the files inside are the pods' own. The
# nightly drift check guards the ownership.
- name: The workloads' state directories are owned by their users
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ argocd_state_dirs }}"
  loop_control:
    label: "{{ item.path }}"

- name: Read whether Argo CD is installed
  vars:
    ansible_python_interpreter: "{{ bedrock_api_python }}"
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: argocd
    kubeconfig: "{{ argocd_kubeconfig }}"
  register: argocd_server
  when: cluster_ready

# Check mode on a cluster without Argo CD yet: the manifest is not downloaded and Argo CD's CRDs do not exist, so
# applying it, waiting for it and applying the root Application cannot be checked. Report the install, skip those.
- name: Argo CD is only described, not installed (check mode, first install)
  ansible.builtin.set_fact:
    argocd_first_check: "{{ ansible_check_mode and (argocd_server.resources | default([]) | length == 0) }}"

- name: Install Argo CD (only where it is missing)
  when: cluster_ready and argocd_server.resources | length == 0
  vars:
    ansible_python_interpreter: "{{ bedrock_api_python }}"
  block:
    - name: Argo CD's namespace
      kubernetes.core.k8s:
        kind: Namespace
        name: argocd
        state: present
        kubeconfig: "{{ argocd_kubeconfig }}"

    - name: Argo CD's release manifest, at the written-down version
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
        dest: "/etc/kubernetes/bedrock-argocd-{{ argocd_version }}.yaml"
        mode: "0644"

    # Server-side apply: Argo CD's CRDs are too big for client-side apply's last-applied annotation
    # (the lab's own install, 8 Oct, needed the same).
    - name: Argo CD runs
      kubernetes.core.k8s:
        state: present
        src: "/etc/kubernetes/bedrock-argocd-{{ argocd_version }}.yaml"
        namespace: argocd
        apply: true
        server_side_apply:
          field_manager: bedrock
        kubeconfig: "{{ argocd_kubeconfig }}"
      when: not argocd_first_check

- name: Argo CD's server is available
  vars:
    ansible_python_interpreter: "{{ bedrock_api_python }}"
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: argocd
    kubeconfig: "{{ argocd_kubeconfig }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  when: cluster_ready and not argocd_first_check

# Only Bedrock's keys (argocd_cm, argocd_cmd_params): the install manifest keeps the rest. force_conflicts takes a key
# over from whoever set it by hand (the lab's kubectl patches), and a later hand edit shows in the nightly drift check.
# Field manager bedrock-settings, never bedrock: the install above applied the whole manifest as bedrock, and a partial
# apply under the same manager releases every field it leaves out. Check mode on ops and staging (31 Oct) showed it:
# argocd-cm would have lost resource.exclusions, the StatefulSet its selector and containers.
- name: Argo CD's settings
  vars:
    ansible_python_interpreter: "{{ bedrock_api_python }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ item.name }}"
        namespace: argocd
      data: "{{ item.data }}"
    apply: true
    server_side_apply:
      field_manager: bedrock-settings
      force_conflicts: true
    kubeconfig: "{{ argocd_kubeconfig }}"
  loop:
    - { name: argocd-cm, data: "{{ argocd_cm }}" }
    - { name: argocd-cmd-params-cm, data: "{{ argocd_cmd_params }}" }
  loop_control:
    label: "{{ item.name }}"
  when: cluster_ready and not argocd_first_check

# Both settings maps reach the processes as environment variables, read at start. A checksum of them on the pod
# templates restarts the controller and the server when they change, and only then (the pattern of Helm's
# checksum/config). ponytail: the repo-server is left out; add it when a reposerver.* key is set.
- name: Argo CD's controller and server run with these settings
  vars:
    ansible_python_interpreter: "{{ bedrock_api_python }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: "{{ item.kind }}"
      metadata:
        name: "{{ item.name }}"
        namespace: argocd
      spec:
        template:
          metadata:
            annotations:
              bedrock.hetops.dev/argocd-settings: "{{ [argocd_cm, argocd_cmd_params] | to_json(sort_keys=true) | hash('sha256') }}"
    apply: true
    server_side_apply:
      field_manager: bedrock-settings
    kubeconfig: "{{ argocd_kubeconfig }}"
  loop:
    - { kind: StatefulSet, name: argocd-application-controller }
    - { kind: Deployment, name: argocd-server }
  loop_control:
    label: "{{ item.name }}"
  when: cluster_ready and not argocd_first_check

# lookup() runs on the controller (the lab, or the CI runner): this repo's file, never a file on the node.
- name: Argo CD follows its cluster's folder in git
  vars:
    ansible_python_interpreter: "{{ bedrock_api_python }}"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../' ~ argocd_root) | from_yaml }}"
    kubeconfig: "{{ argocd_kubeconfig }}"
  when: cluster_ready and not argocd_first_check
