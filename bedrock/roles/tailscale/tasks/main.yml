# Tailscale: the private link between the lab and the other servers (ops 27 Oct, staging 31 Oct). Bedrock installs
# it, keeps the daemon running, keeps --accept-dns=false and Tailscale's own auto-update off (only Bedrock moves the
# version), and checks the node carries its group's tag (tailscale_tag, group_vars). Joining needs a login key the
# owner makes (tagged, single-use, pre-approved): passed as a FILE on the controller, -e tailscale_authkey_file=<path>,
# never as a value, never in git or the log. Tagged nodes never expire, so no key-expiry step.

# get_url reports "changed" in check mode even when the file is there (as with Docker's key in roles/kubernetes),
# which the drift check would take for drift. So: download only when the key is missing.
- name: Is Tailscale's apt key there?
  ansible.builtin.stat:
    path: /usr/share/keyrings/tailscale-archive-keyring.gpg
  register: tailscale_key

- name: Tailscale's signing key (only where it is missing)
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
  when: not tailscale_key.stat.exists

- name: Tailscale's apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: >
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu {{ ansible_facts['distribution_release'] }} main
    mode: "0644"
  register: tailscale_source

- name: The apt cache knows Tailscale's packages  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_source is changed

# Check mode on a machine without the source yet: apt cannot know the package, so skip rather than fail.
- name: Tailscale, at the written-down version
  ansible.builtin.apt:
    name: "tailscale={{ tailscale_version }}"
    state: present
    allow_downgrade: true
    allow_change_held_packages: true
  when: not (ansible_check_mode and tailscale_source is changed)

# Held, like the kube packages (roles/kubernetes): patch.yml's apt upgrade would otherwise move it past
# tailscale_version, and the line above would then be a downgrade. Moving it is a decision: change the version.
- name: Apt holds Tailscale
  ansible.builtin.dpkg_selections:
    name: tailscale
    selection: hold
  register: tailscale_hold
  when: not (ansible_check_mode and tailscale_source is changed)

- name: Read which packages apt holds back
  ansible.builtin.command: apt-mark showhold
  register: tailscale_held
  check_mode: false
  changed_when: false

- name: Apt will not upgrade Tailscale behind Bedrock's back
  ansible.builtin.assert:
    that: "'tailscale' in tailscale_held.stdout_lines"
    fail_msg: "tailscale is not held: an apt upgrade could move it to another version"
    quiet: true
  when: not (ansible_check_mode and (tailscale_source is changed or tailscale_hold is changed))   # check mode: not held yet

- name: The Tailscale daemon runs, and starts on boot
  ansible.builtin.systemd_service:
    name: tailscaled
    state: started
    enabled: true
  when: not (ansible_check_mode and tailscale_source is changed)

# The rest talks to tailscaled, so it needs Tailscale installed: check mode on a server without it stops here.
- name: Tailscale is joined, tagged, and stays out of the host's DNS and updates
  when: not (ansible_check_mode and tailscale_source is changed)
  block:
    - name: Read whether this server is on the tailnet
      ansible.builtin.command: tailscale status --json --peers=false
      register: tailscale_status
      check_mode: false
      changed_when: false
      failed_when: false            # not logged in is an answer, not a failure

    - name: Join the tailnet (only with a key file, only where not joined)
      when:
        - (tailscale_status.stdout | from_json).BackendState | default('') != 'Running'
        - tailscale_authkey_file | default('') | length > 0
      block:
        - name: Join the tailnet (would change)
          ansible.builtin.command: "true"
          check_mode: false
          changed_when: true
          when: ansible_check_mode

        # The key goes to the node as a root-only file in /run (RAM) and tailscale reads it from there (file: prefix),
        # so it is never on a command line (ps, audit logs) nor in Ansible's output (no_log). Removed whatever happens.
        - name: Join the tailnet
          when: not ansible_check_mode
          block:
            - name: The login key, for tailscale up only
              ansible.builtin.copy:
                src: "{{ tailscale_authkey_file }}"
                dest: /run/bedrock-tailscale-authkey
                owner: root
                group: root
                mode: "0600"
              no_log: true

            # accept-dns=false from the first second: tailscaled never takes the host resolver, even briefly.
            - name: Tailscale up, with the login key
              ansible.builtin.command: tailscale up --auth-key=file:/run/bedrock-tailscale-authkey --accept-dns=false
              changed_when: true
          always:
            - name: The login key is gone from the node
              ansible.builtin.file:
                path: /run/bedrock-tailscale-authkey
                state: absent

            - name: Read the tailnet state after joining
              ansible.builtin.command: tailscale status --json --peers=false
              register: tailscale_status
              check_mode: false
              changed_when: false
              failed_when: false

    # The tag decides every grant (tailscale/policy.hujson). A key without the tag would make this server a member's
    # device, with members' access: refuse that loudly. Only on a joined node (CI's runner never joins).
    - name: The node carries its group's tag
      ansible.builtin.assert:
        that: tailscale_tag in ((tailscale_status.stdout | from_json).Self.Tags | default([], true))
        fail_msg: "joined without {{ tailscale_tag }}: remove the machine in the admin console and join again with a {{ tailscale_tag }} key"
        quiet: true
      when: (tailscale_status.stdout | from_json).BackendState | default('') == 'Running'

    # Servers must resolve names when the lab is down: the tailnet's nameserver is AdGuard on the lab, and accepting
    # tailnet DNS makes tailscaled the host resolver (catch-all), so every lookup hung when the policy blocked port 53
    # (29 Oct). Ops and staging keep their provider resolver. The lab's own Tailscale is not Bedrock-managed and resolves
    # through its local AdGuard. CorpDNS is the "accepts tailnet DNS" preference; AutoUpdate.Apply is Tailscale's own
    # updater, which the tailnet setting "auto-update new devices" can switch on at join.
    - name: Read Tailscale's preferences
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_prefs
      check_mode: false
      changed_when: false

    # A command task is skipped in check mode, which would hide the drift from the nightly check; so check mode gets a
    # no-op that reports the change, and the real command runs on apply.
    - name: Tailscale does not take over the host's DNS (would change)
      ansible.builtin.command: "true"
      check_mode: false
      changed_when: true
      when: ansible_check_mode and (tailscale_prefs.stdout | from_json).CorpDNS | default(false)

    - name: Tailscale does not take over the host's DNS
      ansible.builtin.command: tailscale set --accept-dns=false
      changed_when: true
      when: not ansible_check_mode and (tailscale_prefs.stdout | from_json).CorpDNS | default(false)

    - name: Tailscale does not update itself (would change)
      ansible.builtin.command: "true"
      check_mode: false
      changed_when: true
      when: ansible_check_mode and (tailscale_prefs.stdout | from_json).AutoUpdate.Apply | default(false, true)

    - name: Tailscale does not update itself
      ansible.builtin.command: tailscale set --auto-update=false
      changed_when: true
      when: not ansible_check_mode and (tailscale_prefs.stdout | from_json).AutoUpdate.Apply | default(false, true)
