# The OS baseline a kubeadm node needs, as the kubeadm install guide sets it up. Phase 1: if the server
# was set up differently (another file name, another value), check mode shows the difference and this
# role is changed to match the server, not the other way round.

- name: The server is the one Bedrock was written for
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'aarch64'
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: "Bedrock expects arm64 Ubuntu, found {{ ansible_facts['architecture'] }} {{ ansible_facts['distribution'] }}"
    quiet: true

- name: Security updates install themselves
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Kernel modules for containers and pod networking load at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: The kernel forwards packets between pods
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present

# Discovery shows this is 1 on the server. Whether it is 1 because of this file, or because something
# sets it at runtime, is what check mode will tell.
- name: Bridged pod traffic goes through iptables
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: "1"
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present

- name: Swap is off (the kubelet refuses to run with it by default)
  ansible.builtin.assert:
    that: ansible_facts['swaptotal_mb'] == 0
    fail_msg: "swap is on ({{ ansible_facts['swaptotal_mb'] }} MB)"
    quiet: true

# SSH (Phase 2): Bedrock's settings in one drop-in file. validate: tests the rendered file with sshd before
# it replaces anything; the handlers then test the whole config and reload SSH, only if the file changed.
- name: SSH uses Bedrock's settings
  ansible.builtin.template:
    src: 10-bedrock.conf.j2
    dest: /etc/ssh/sshd_config.d/10-bedrock.conf
    owner: root
    group: root
    mode: "0644"
    validate: sshd -t -f %s
  register: base_ssh_dropin
  notify:
    - Check the whole SSH config
    - Reload SSH

# Run the handlers now, not at the end of the play, so the check below reads the new settings.
- name: Apply a changed SSH config before checking it
  ansible.builtin.meta: flush_handlers

# A read, never a change: sshd -T prints the settings sshd is actually using, after every include.
- name: Read SSH's effective settings
  ansible.builtin.command: sshd -T
  register: base_sshd
  check_mode: false
  changed_when: false

# sshd -T prints lower-case names and values, and "without-password" for prohibit-password. In check
# mode with a pending change, sshd still runs the old settings, so the check waits for the real run.
- name: SSH really runs with each of Bedrock's settings
  ansible.builtin.assert:
    that: "(item.key ~ ' ' ~ ('without-password' if item.value == 'prohibit-password' else item.value) | string | lower) in base_sshd.stdout_lines"
    fail_msg: "sshd runs {{ base_sshd.stdout_lines | select('match', '^' ~ item.key ~ ' ') | list }}, Bedrock wants {{ item.key }} {{ item.value }}"
    quiet: true
  loop: "{{ base_ssh | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: not (ansible_check_mode and base_ssh_dropin is changed)
