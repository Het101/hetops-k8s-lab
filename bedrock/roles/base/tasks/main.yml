# The OS baseline a kubeadm node needs, as the kubeadm install guide sets it up. Phase 1: if the server
# was set up differently (another file name, another value), check mode shows the difference and this
# role is changed to match the server, not the other way round. What every server gets (SSH, updates,
# reboot awareness) moved to roles/common on 25 Oct, when a second, non-Kubernetes server joined.

- name: Kernel modules for containers and pod networking load at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: Those modules are loaded now, not only after a reboot
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: The kernel forwards packets between pods
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present

# Discovery shows this is 1 on the server. Whether it is 1 because of this file, or because something
# sets it at runtime, is what check mode will tell.
- name: Bridged pod traffic goes through iptables
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: "1"
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present

# The kubelet refuses to run with swap on (by default). The live server has none; a fresh machine
# (a CI runner) may: turn it off now and keep it off after a reboot.
- name: Swap is turned off
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  register: base_swapoff
  changed_when: true

- name: Swap stays off after a reboot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s].*\sswap\s.*)$'
    replace: '# \1   # off: kubelet (Bedrock)'

- name: Read swap
  ansible.builtin.command: swapon --show --noheadings
  register: base_swap
  check_mode: false
  changed_when: false

- name: Swap is off
  ansible.builtin.assert:
    that: base_swap.stdout | length == 0
    fail_msg: "swap is on: {{ base_swap.stdout }}"
    quiet: true
  when: not (ansible_check_mode and base_swapoff is changed)

# Oracle's Ubuntu images end the FORWARD chain with a REJECT, saved in /etc/iptables/rules.v4 (netfilter-persistent
# restores it at boot). Pod-to-Service traffic is forwarded by the host, so it hits that REJECT ("No route to host").
# Day 1 on the lab: removed by hand (journal Part 1). 25 Oct on staging: Bedrock had never encoded it, so vm2's
# pods could not reach any Service (found by the CrowdSec rehearsal; CI runners have no such rule). Both the running
# rule and the saved one go; the INPUT REJECT stays (it guards the host itself).
- name: Read the FORWARD chain
  ansible.builtin.command: iptables -S FORWARD
  register: base_forward
  changed_when: false
  check_mode: false

- name: The FORWARD chain does not reject pod traffic (every copy of Oracle's rule)
  ansible.builtin.shell: |
    set -o pipefail
    n=0
    while iptables -C FORWARD -j REJECT --reject-with icmp-host-prohibited 2>/dev/null; do
      iptables -D FORWARD -j REJECT --reject-with icmp-host-prohibited; n=$((n+1))
    done
    echo "removed $n"
  args:
    executable: /bin/bash
  when: "'-A FORWARD -j REJECT --reject-with icmp-host-prohibited' in base_forward.stdout_lines"
  changed_when: true

- name: And it stays gone after a reboot
  ansible.builtin.lineinfile:
    path: /etc/iptables/rules.v4
    regexp: '^-A FORWARD -j REJECT --reject-with icmp-host-prohibited$'
    state: absent                  # a server without the file (not an Oracle image, a CI runner): nothing to do
