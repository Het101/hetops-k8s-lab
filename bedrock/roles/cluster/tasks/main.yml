# The cluster itself: kubeadm init, the user's kubeconfig, Calico, a Ready node. Every step that
# CREATES runs only on a machine without a cluster, so on the live server this role only reads (ok).

- name: Is this machine already a cluster?
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: cluster_admin_conf

- name: Build the cluster (only on a machine without one)
  when: not cluster_admin_conf.stat.exists
  block:
    - name: The audit policy is in place before the API server first starts
      ansible.builtin.include_role:
        name: audit
        tasks_from: policy

    - name: Kubeadm's config for this cluster
      ansible.builtin.template:
        src: kubeadm.yaml.j2
        dest: /etc/kubernetes/bedrock-kubeadm.yaml
        mode: "0600"

    - name: Kubeadm init
      ansible.builtin.command: kubeadm init --config /etc/kubernetes/bedrock-kubeadm.yaml
      args:
        creates: /etc/kubernetes/admin.conf

# The node's user (bedrock_kube_user: the controller user on the lab, ubuntu on staging) gets a kubeconfig;
# the audit and cluster roles' kubernetes.core tasks use it. An existing one is never replaced.
- name: The node user has a .kube directory
  ansible.builtin.file:
    path: "{{ bedrock_kube_home }}/.kube"
    state: directory
    owner: "{{ bedrock_kube_user }}"
    mode: "0700"
  when: not cluster_admin_conf.stat.exists

- name: The node user can reach the cluster
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    remote_src: true
    dest: "{{ bedrock_kube_home }}/.kube/config"
    owner: "{{ bedrock_kube_user }}"
    mode: "0600"
    force: false
  when: not cluster_admin_conf.stat.exists

# Option A (25 Oct): every API task below runs ON this node, with this node's kubeconfig. In check mode on a
# node without a cluster yet nothing above ran, so there is no API to ask: skip the API tasks (here and in
# roles/audit) rather than fail. A real run always has a cluster by this point.
- name: Is there a cluster to ask?
  ansible.builtin.set_fact:
    cluster_ready: "{{ cluster_admin_conf.stat.exists or not ansible_check_mode }}"

# The guard: a staging run must never reach the lab's API (or the reverse). The kubeconfig's server must be
# one of this node's own addresses, so a mix-up of kubeconfigs fails here instead of changing the wrong cluster.
- name: Read which API server the node user's kubeconfig points at
  ansible.builtin.slurp:
    src: "{{ audit_kubeconfig }}"
  register: cluster_kubeconfig
  when: cluster_ready

- name: The kubeconfig talks to this node's own API server
  vars:
    cluster_api_host: "{{ (cluster_kubeconfig.content | b64decode | from_yaml).clusters[0].cluster.server | urlsplit('hostname') }}"
  ansible.builtin.assert:
    that: cluster_api_host in (ansible_facts['all_ipv4_addresses'] + ['127.0.0.1'])
    fail_msg: "{{ audit_kubeconfig }} on {{ inventory_hostname }} points at {{ cluster_api_host }}, not at this node: refusing to touch another cluster"
    quiet: true
  when: cluster_ready

- name: Look for Calico
  vars:
    ansible_python_interpreter: "{{ bedrock_api_python }}"
  kubernetes.core.k8s_info:
    kind: DaemonSet
    namespace: kube-system
    name: calico-node
    kubeconfig: "{{ audit_kubeconfig }}"
  register: cluster_calico
  when: cluster_ready

- name: Calico is installed (only where it is missing)
  when: cluster_ready and cluster_calico.resources | length == 0
  block:
    - name: Calico's manifest, at the written-down version
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/projectcalico/calico/{{ cluster_calico_version }}/manifests/calico.yaml"
        dest: "/etc/kubernetes/bedrock-calico-{{ cluster_calico_version }}.yaml"
        mode: "0644"

    - name: Calico runs
      vars:
        ansible_python_interpreter: "{{ bedrock_api_python }}"
      kubernetes.core.k8s:
        state: present
        src: "/etc/kubernetes/bedrock-calico-{{ cluster_calico_version }}.yaml"
        kubeconfig: "{{ audit_kubeconfig }}"

- name: The node is Ready
  vars:
    ansible_python_interpreter: "{{ bedrock_api_python }}"
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: "{{ audit_kubeconfig }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 300
  when: cluster_ready
