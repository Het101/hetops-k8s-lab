# Role defaults: the lowest-precedence variables. group_vars/<group>.yml, host_vars/<host>.yml or -e can
# override any of them without touching the role.

# SSH settings Bedrock owns, written to /etc/ssh/sshd_config.d/10-bedrock.conf. sshd keeps the FIRST
# value it reads for each setting, and Ubuntu includes sshd_config.d/*.conf in name order at the top
# of sshd_config, so 10- wins over cloud-init's 50-cloud-init.conf.
common_ssh:
  passwordauthentication: "no"
  permitrootlogin: prohibit-password      # sshd -T prints this as "without-password"
  x11forwarding: "no"                     # discovery: was yes; nothing on a server needs it
  maxauthtries: 3                         # discovery: was the default 6
  # Dead connections, not idle ones: a client that stops answering 3 keepalives (5 min apart) is
  # dropped. Discovery found about 40 old sessions whose clients had long gone.
  clientaliveinterval: 300
  clientalivecountmax: 3
