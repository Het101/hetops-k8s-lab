# The upgrade to Kubernetes 1.34 (from 1.33), the second of three on the way to 1.35.
#   ansible-playbook upgrade.yml -e @upgrades/1.34.yml --tags kubernetes
# (Calico is already v3.31.7 from upgrades/1.33.yml: the calico tag changes nothing.)
upgrade_kubernetes_minor: "1.34"
upgrade_kubernetes_package_version: "1.34.12-1.1"   # the latest 1.34 patch on pkgs.k8s.io, 25 Oct 2026
upgrade_calico_version: v3.31.7
# kubeadm 1.34 moves etcd from 3.5.24 to 3.6.5 (cmd/kubeadm/app/constants). 3.6 needs 3.5.20 or later first,
# which 3.5.24 is. The etcd snapshot upgrade-one.yml takes before apply is the way back.
upgrade_etcd: true
upgrade_from_vars:
  kubernetes_minor: "1.33"
  kubernetes_package_version: "1.33.13-1.1"
  cluster_calico_version: v3.31.7
