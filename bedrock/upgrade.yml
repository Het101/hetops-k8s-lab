# Kubernetes and Calico upgrades across the fleet, one step at a time, staging first, with the values from
# upgrades/<minor>.yml:
#   ansible-playbook upgrade.yml -e @upgrades/1.33.yml --tags calico                       staging
#   ansible-playbook upgrade.yml -e @upgrades/1.33.yml --tags kubernetes                   staging
#   ansible-playbook upgrade.yml -e @upgrades/1.33.yml --tags kubernetes -e upgrade_lab=true   then the lab
# Each step does nothing if the server is already there, so it is safe to run twice. Rehearsed in CI on a
# throwaway cluster (job: upgrade), then on staging, before it ever runs on the lab server.
#
# While staging is ahead, group_vars/staging.yml pins its versions over group_vars/k8s.yml (the nightly drift
# check would otherwise call the upgraded staging drifted). Once the lab catches up, the new values move to
# k8s.yml and the pins come out of staging.yml.

# Staging is the canary: if anything fails here, the run stops and the lab is never touched.
- name: Upgrade staging
  hosts: staging
  become: true
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Upgrade this server
      ansible.builtin.import_tasks: tasks/upgrade-one.yml

# The lab runs every live site: only when asked, and only after staging passed in the same run.
- name: Upgrade the lab
  hosts: lab
  become: true
  serial: 1
  max_fail_percentage: 0
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Skip the lab unless asked
      ansible.builtin.meta: end_host
      when: not (upgrade_lab | default(false) | bool)
      tags: [always]

    - name: Upgrade this server
      ansible.builtin.import_tasks: tasks/upgrade-one.yml
