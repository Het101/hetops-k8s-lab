# Reboot the fleet, staging and ops first, and prove everything came back on its own. Bedrock's other playbooks
# never reboot (roles/common only reports a pending one); this is the one that does, in a window the owner picks.
#
#   ansible-playbook reboot.yml                          staging and ops, if they have a reboot pending
#   ansible-playbook reboot.yml -e reboot_force=true     staging and ops, pending or not (a boot test)
#   ansible-playbook reboot.yml -e reboot_lab=true       staging and ops, then the lab (only if they came back)
#   ansible-playbook reboot.yml --tags verify -e reboot_lab=true    after the lab is back: did everything return?
#
# The lab is the control node: Ansible runs on it, so it cannot reboot itself and wait. Its play schedules the
# reboot 60 s out and ends; the verify run above checks it afterwards (tasks/reboot-one.yml).
#
# Why the lab is opt-in: it runs every live site (Coolify), so its reboot is a few minutes of downtime.
# Rehearsed by hand on staging on 25 Oct: SSH back in 37 s, every pod Ready 69 s from boot, site.yml changed=0.

# Staging is the canary: if it does not come back healthy, the run stops and the lab is never touched.
- name: Reboot staging and ops
  hosts: staging:ops
  become: true
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Reboot this server
      ansible.builtin.import_tasks: tasks/reboot-one.yml

- name: Reboot the lab
  hosts: lab
  become: true
  serial: 1
  max_fail_percentage: 0
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Skip the lab unless asked
      ansible.builtin.meta: end_host
      when: not (reboot_lab | default(false) | bool)
      tags: [always]

    - name: Reboot this server
      ansible.builtin.import_tasks: tasks/reboot-one.yml
