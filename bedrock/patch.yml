# Patch the fleet: every package update apt offers (held packages stay held), one server at a time,
# staging and ops first. Security updates already install themselves daily (roles/common: unattended-upgrades);
# this is for everything else, in a window the owner picks.
#
#   ansible-playbook patch.yml --check                  what would update, on staging and ops
#   ansible-playbook patch.yml                          patch staging and ops
#   ansible-playbook patch.yml -e patch_lab=true        staging and ops, then the lab (only if they passed)
#
# Why the lab is opt-in: an update to docker-ce or containerd restarts Docker, and every live site
# (Coolify) restarts with it. The kube packages and containerd are held, so they never move here; a
# Kubernetes upgrade is upgrade.yml's job.

# Staging is the canary: if anything fails here, the play stops and the lab is never touched.
- name: Patch staging and ops
  hosts: staging:ops
  become: true
  serial: 1                        # one server at a time, once the group has more than one
  max_fail_percentage: 0           # one failure stops the rest
  any_errors_fatal: true           # ... and every play after this one
  tasks:
    - name: Patch this server
      ansible.builtin.include_tasks: tasks/patch-one.yml

- name: Patch the lab
  hosts: lab
  become: true
  serial: 1
  max_fail_percentage: 0
  tasks:
    - name: Skip the lab unless asked
      ansible.builtin.meta: end_host
      when: not (patch_lab | default(false) | bool)

    - name: Patch this server
      ansible.builtin.include_tasks: tasks/patch-one.yml

    # The lab runs the cluster and every live site: prove both came through.
    - name: The Kubernetes API answers ready
      ansible.builtin.command: kubectl get --raw /readyz
      become: false
      register: patch_readyz
      changed_when: false
      check_mode: false
      retries: 12
      delay: 10
      until: patch_readyz.stdout == 'ok'

    - name: Docker is running
      ansible.builtin.systemd_service:
        name: docker
        state: started
      check_mode: true             # a check, never a start: if it were stopped, that is the finding
      register: patch_docker
      failed_when: patch_docker is changed
