# The fleet, from the OS up to running clusters.
#   On the live servers: ansible-playbook site.yml --check --diff   (it describes them: changed=0)
#   One group only:      ansible-playbook site.yml --limit staging
#   On a blank machine:  ansible-playbook site.yml                  (it builds one: CI, Phase 3)

# Every server gets the baseline: SSH hardening, automatic security updates, reboot awareness.
- name: Every server
  hosts: all
  become: true
  roles:
    - common

# Every Kubernetes node (group k8s: the lab and staging) is built the same way, at the same versions.
# Each node manages its own cluster (option A): API tasks run on the node, with the node's kubeconfig.
- name: Kubernetes nodes
  hosts: k8s
  become: true
  roles:
    - base
    - kubernetes
    - cluster
    - audit

# The ops (hetops-3, 27 Oct) and staging (vm2, 31 Oct) clusters' private link. The lab's Tailscale is not Bedrock's.
- name: The ops and staging clusters
  hosts: ops:staging
  become: true
  roles:
    - tailscale

# Every cluster's Argo CD: installed where missing (ops, staging; the lab's dates from 8 Oct), its settings, and the
# folder it deploys (argocd_root in group_vars: argo/ for the lab, clusters/<name>/ for the others).
- name: Every cluster's Argo CD
  hosts: k8s
  become: true
  roles:
    - argocd

# The nightly drift check lives on the control node (the lab) and checks the whole fleet from there.
- name: The control node
  hosts: lab
  become: true
  roles:
    - drift
