# The fleet. Ansible runs on the lab server (the control node): it manages itself without SSH and every
# other server over SSH with ~/.ssh/bedrock_fleet, a key accepted only from the lab server's IP
# (from="140.245.13.138" in each target's authorized_keys). CI uses tests/ci-inventory.ini instead.
#
# Groups say what a server is FOR; plays in site.yml target groups, never single hosts.
#   lab      the production Kubernetes lab (every live site runs here); also the control node
#   staging  where changes are tried first (Oracle A1, joined 25 Oct)
#   ops      the ops cluster (hetops-3, 27 Oct): tools the lab relies on, its own Argo CD (clusters/ops/)
#   k8s      every Kubernetes node: a parent group of all three, so they share one set of versions
#            (group_vars/k8s.yml) and staging mirrors production by construction

[lab]
my-workspace ansible_connection=local

[staging]
vm2 ansible_host=140.238.224.158

[ops]
hetops-3 ansible_host=130.210.37.122

[k8s:children]
lab
staging
ops
