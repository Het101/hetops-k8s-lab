apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clinic
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: lab
  source:
    repoURL: https://github.com/Het101/hetops-k8s-lab.git
    targetRevision: main
    path: apps/clinic/overlays/lab
  destination: { server: https://kubernetes.default.svc, namespace: clinic }
  ignoreDifferences:              # the HPA owns api replicas (3-5); without this, selfHeal fights it back to 3
  - { group: apps, kind: Deployment, name: api, namespace: clinic, jsonPointers: [/spec/replicas] }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [RespectIgnoreDifferences=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
