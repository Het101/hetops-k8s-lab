apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"     # first: namespaces, quotas, tunnel
spec:
  project: lab
  source:
    repoURL: https://github.com/Het101/hetops-k8s-lab.git
    targetRevision: main
    path: platform
  destination: { server: https://kubernetes.default.svc, namespace: platform }
  syncPolicy:
    automated: { prune: true, selfHeal: true }   # delete what left git; undo manual changes
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
