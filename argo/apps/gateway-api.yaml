# Gateway API CRDs, owned here (22 Oct) instead of by linkerd-crds (installGatewayAPI: false): Linkerd recommends
# installing them yourself in production, it supports 1.2.1-1.5.1, and its own copy was v1.1.1 (below that range).
# The experimental channel keeps TCPRoute and TLSRoute, which Linkerd's policy controller watches, and it is
# what the next step's NGINX Gateway Fabric reads. The bundle includes a ValidatingAdmissionPolicy that refuses
# CRD downgrades and channel mixing. Design: docs/superpowers/specs/2026-10-22-gateway-migration-design.md
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }   # before linkerd (0): the CRDs come first
spec:
  project: mesh
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.5.1
    path: config/crd/experimental
    kustomize:
      # CRDs are never pruned or deleted by Argo CD: deleting one deletes every object of that kind.
      commonAnnotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
  destination: { server: https://kubernetes.default.svc, namespace: linkerd }   # CRDs are cluster-wide; the project allows linkerd
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ServerSideApply=true]                  # CRDs are larger than client-side apply's annotation limit
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
