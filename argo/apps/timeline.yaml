# Change Timeline: one feed of every change and alert in the lab (Het101/change-timeline).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: timeline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: lab
  source:
    repoURL: https://github.com/Het101/hetops-k8s-lab.git
    targetRevision: main
    path: apps/timeline
  destination: { server: https://kubernetes.default.svc, namespace: timeline }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
