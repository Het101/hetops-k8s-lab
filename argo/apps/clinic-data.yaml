apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clinic-data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: lab
  source:
    repoURL: https://github.com/Het101/hetops-k8s-lab.git
    targetRevision: main
    path: apps/clinic-data
  destination: { server: https://kubernetes.default.svc, namespace: clinic-data }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
