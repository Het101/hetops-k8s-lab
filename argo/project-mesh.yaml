apiVersion: argoproj.io/v1alpha1
kind: AppProject                  # the service mesh needs CRDs, cluster RBAC and admission webhooks; "lab" must not
metadata:
  name: mesh
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  description: Linkerd service mesh (mTLS track) and the Gateway API entry point
  sourceRepos:
  - https://github.com/Het101/hetops-k8s-lab.git
  - https://helm.linkerd.io/edge
  - https://github.com/kubernetes-sigs/gateway-api.git   # the Gateway API CRDs (argo/apps/gateway-api.yaml)
  - ghcr.io/nginx/charts                                 # NGINX Gateway Fabric (argo/apps/gateway.yaml)
  destinations:
  - { server: https://kubernetes.default.svc, namespace: linkerd }
  - { server: https://kubernetes.default.svc, namespace: linkerd-cni }
  - { server: https://kubernetes.default.svc, namespace: nginx-gateway }
  clusterResourceWhitelist:
  - { group: "", kind: Namespace }
  - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
  - { group: rbac.authorization.k8s.io, kind: ClusterRole }
  - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
  - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
  - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
  - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy }          # Gateway API: refuses CRD downgrades
  - { group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding }
  - { group: gateway.networking.k8s.io, kind: GatewayClass }                           # NGINX Gateway Fabric's class, nginx
