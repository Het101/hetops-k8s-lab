# HetOps Control on staging (stage 3): this cluster's agent, from clusters/staging/control. The center on hetops-3
# reads it over Tailscale. The ops cluster's Argo CD deploys the center; the lab's deploys the lab agent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: control
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Het101/hetops-k8s-lab.git
    targetRevision: main
    path: clusters/staging/control
  destination: { server: https://kubernetes.default.svc, namespace: control }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # a rebuild can sync this before the SealedSecret CRD exists; automated sync does not retry the same commit without this
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
