# Sealed secrets on staging, at the lab's version. Its controller makes its own key: a secret sealed
# for this cluster cannot be opened on the lab, and the reverse. Seal with: kubeseal --controller-namespace kube-system
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Het101/hetops-k8s-lab.git
    targetRevision: main
    path: clusters/staging/sealed-secrets
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
