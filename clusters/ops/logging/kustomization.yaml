apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logging
resources:
  - namespace.yaml
  - sealed-es-http-tls.yaml
  - sealed-user-lab-shipper.yaml
  - sealed-user-gatus-watcher.yaml
  - sealed-user-control-reader.yaml
  - sealed-cloudflared-token.yaml
  - sealed-r2.yaml
  - elasticsearch.yaml
  - kibana.yaml
  - cloudflared.yaml
  - setup/job.yaml
  - kibana-objects/job.yaml
secretGenerator:
  - name: ops-es-roles
    files: [roles.yml]
    options: { disableNameSuffixHash: true }
configMapGenerator:
  - name: es-setup
    files: [setup/setup.sh, setup/ilm-logs-lab-7d.json, setup/template-logs-lab.json, setup/repo-local.json, setup/slm-nightly-all.json, setup/repo-r2.json, setup/slm-nightly-security.json]
    options: { disableNameSuffixHash: true }
  - name: kibana-objects
    files: [kibana-objects/import.sh, kibana-objects/data-view-lab-logs.json, kibana-objects/rules.ndjson]
    options: { disableNameSuffixHash: true }
