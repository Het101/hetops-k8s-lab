apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: logging
resources:
  - namespace.yaml
  - sealed-es-http-tls.yaml
  - sealed-user-lab-shipper.yaml
  - sealed-user-gatus-watcher.yaml
  - sealed-cloudflared-token.yaml
  - elasticsearch.yaml
  - kibana.yaml
  - cloudflared.yaml
  - setup/job.yaml
secretGenerator:
  - name: ops-es-roles
    files: [roles.yml]
    options: { disableNameSuffixHash: true }
configMapGenerator:
  - name: es-setup
    files: [setup/setup.sh, setup/ilm-logs-lab-7d.json, setup/template-logs-lab.json, setup/repo-local.json, setup/slm-nightly-all.json]
    options: { disableNameSuffixHash: true }
