# Loads kibana-objects/ into Kibana after every sync (Argo PostSync hook, replaced each time).
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-objects
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900   # a sick ES/Kibana fails the hook instead of hanging Argo
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 100, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: import
          image: curlimages/curl:8.17.0
          command: [sh, /objects/import.sh]
          env:
            - name: ELASTIC_PASSWORD
              valueFrom: { secretKeyRef: { name: ops-logs-es-elastic-user, key: elastic } }
          volumeMounts:
            - { name: objects, mountPath: /objects }
            - { name: tmp, mountPath: /tmp }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: objects
          configMap: { name: kibana-objects }
        - name: tmp
          emptyDir: {}
