# Applies setup/*.json after every sync of the logging app (an Argo PostSync hook, replaced each time).
apiVersion: batch/v1
kind: Job
metadata:
  name: es-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900   # a sick ES/Kibana fails the hook instead of hanging Argo
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 100, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: setup
          image: curlimages/curl:8.17.0
          command: [sh, /setup/setup.sh]
          env:
            - name: ELASTIC_PASSWORD
              valueFrom: { secretKeyRef: { name: ops-logs-es-elastic-user, key: elastic } }
          volumeMounts:
            - { name: setup, mountPath: /setup }
            - { name: certs, mountPath: /certs }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: setup
          configMap: { name: es-setup }
        - name: certs
          secret: { secretName: ops-es-http-tls, items: [{ key: ca.crt, path: ca.crt }] }
