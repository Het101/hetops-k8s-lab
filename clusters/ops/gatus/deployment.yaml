# Gatus, reachable only over Tailscale: the hostPort is bound to hetops-3's Tailscale address, so the CNI forwards
# 8080 only for traffic to 100.89.67.82; the public IP gets nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
spec:
  replicas: 1
  strategy: { type: Recreate }          # one hostPort, one pod: never two at once
  selector:
    matchLabels: { app: gatus }
  template:
    metadata:
      labels: { app: gatus }
      annotations:
        hetops.dev/config-version: "4"  # bump to restart Gatus on a config change it does not pick up itself
    spec:
      automountServiceAccountToken: false   # Gatus never calls the Kubernetes API
      # The image is FROM scratch with no user, so the UID is set here. Bedrock (roles/argocd) owns /var/lib/gatus as
      # 65532, because fsGroup does not apply to hostPath volumes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gatus
          image: ghcr.io/twin/gatus:v5.37.0
          ports:
            - containerPort: 8080
              hostPort: 8080
              hostIP: 100.89.67.82
          envFrom:
            - secretRef: { name: gatus-secrets }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: config
          configMap: { name: gatus-config }
        # One node, so a hostPath is the node's disk: history and open alerts, lost if hetops-3 is rebuilt. Type
        # Directory: Bedrock creates it owned by 65532, and a missing one fails loudly instead of appearing as root's.
        - name: data
          hostPath: { path: /var/lib/gatus, type: Directory }
