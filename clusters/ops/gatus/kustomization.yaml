apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: watch
resources:
  - namespace.yaml
  - config.yaml
  - sealed-gatus-secrets.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: es-ca
    files:
      - ca.crt=es-ca.crt
    options:
      disableNameSuffixHash: true
