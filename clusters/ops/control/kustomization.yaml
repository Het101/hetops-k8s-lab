# HetOps Control (stage 1a): the center and the ops agent. No top-level `namespace:` here: rbac.yaml puts a Role in
# argocd, which kustomize would otherwise move into control.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - sealed-agent-token.yaml
  - sealed-agent-tokens.yaml
  - sealed-es-reader.yaml
  - agent.yaml
  - center.yaml
  - networkpolicy.yaml
configMapGenerator:
  # the ops CA: it signed the lab agent's server certificate. A copy of clusters/ops/logging/es-ca.crt (kustomize
  # cannot load files outside this directory): keep the two in sync when the CA is rotated. The PEM itself carries no
  # comment, so the center reads it exactly as openssl wrote it.
  - name: ops-ca
    namespace: control
    files:
      - ca.crt=ops-ca.crt
    options:
      disableNameSuffixHash: true
