# The ops agent: reads this cluster and serves it to the center over plain HTTP inside the cluster. The lab agent
# (deployed by the lab) is the one with TLS, since its traffic crosses the tailnet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-agent
  namespace: control
spec:
  replicas: 1
  selector:
    matchLabels: { app: control-agent }
  template:
    metadata:
      labels: { app: control-agent }
    spec:
      serviceAccountName: control-agent
      automountServiceAccountToken: true   # the agent is a Kubernetes API client (rbac.yaml)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          # hetops-control main e20cd1121473cbf3530c4ca08861e14a7a8b4a51
          image: ghcr.io/het101/hetops-control-agent@sha256:6ee12f821a86aae40728462e8dcda108f12257ccc542f323ba56399092d4a8b4
          env:
            - { name: SERVER, value: ops }
            - { name: AGENT_TOKEN_FILE, value: /secrets/token }
            # ops sources (hetops-control apps/agent/src/sources/gatus.ts, elasticsearch.ts)
            - { name: GATUS_URL, value: "http://gatus.watch.svc:8080" }
            - { name: ES_URL, value: "https://ops-logs-es-http.logging.svc:9200" }
            - { name: ES_AUTH_DIR, value: /es-reader }             # control-reader: role control_reader in logging/roles.yml
            - { name: NODE_EXTRA_CA_CERTS, value: /ca/ca.crt }     # the ops CA signed the ES http certificate
            # stage 2: the verbs this agent offers (hetops-control apps/agent/src/actions). snapshot.now runs an SLM policy as
            # control-operator (manage_slm); every read stays with control-reader.
            - { name: ACTIONS, value: snapshot.now }
            - { name: ES_OPERATOR_DIR, value: /es-operator }
          ports:
            - { name: http, containerPort: 7443 }
          volumeMounts:
            - { name: token, mountPath: /secrets, readOnly: true }
            - { name: es-reader, mountPath: /es-reader, readOnly: true }
            - { name: es-operator, mountPath: /es-operator, readOnly: true }
            - { name: ops-ca, mountPath: /ca, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: token
          secret: { secretName: control-agent-token }
        - name: es-reader
          secret: { secretName: control-es-reader, items: [{ key: username, path: username }, { key: password, path: password }] }
        - name: es-operator
          secret: { secretName: control-es-operator, items: [{ key: username, path: username }, { key: password, path: password }] }
        - name: ops-ca
          configMap: { name: ops-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: control-agent
  namespace: control
spec:
  selector: { app: control-agent }
  ports:
    - { name: http, port: 7443, targetPort: http }
