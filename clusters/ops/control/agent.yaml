# The ops agent: reads this cluster and serves it to the center over plain HTTP inside the cluster. The lab agent
# (deployed by the lab) is the one with TLS, since its traffic crosses the tailnet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-agent
  namespace: control
spec:
  replicas: 1
  selector:
    matchLabels: { app: control-agent }
  template:
    metadata:
      labels: { app: control-agent }
    spec:
      serviceAccountName: control-agent
      automountServiceAccountToken: true   # the agent is a Kubernetes API client (rbac.yaml)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          # hetops-control main 6f0c68d0ffb108c01dbe1d73a1db43bfa66e45fe
          image: ghcr.io/het101/hetops-control-agent@sha256:fea9337d3b0d91bc3c2aee8ac0eb65ba86816ad28a2bc5cba827b18b6831e0c4
          env:
            - { name: SERVER, value: ops }
            - { name: AGENT_TOKEN_FILE, value: /secrets/token }
            # ops sources (hetops-control apps/agent/src/sources/gatus.ts, elasticsearch.ts)
            - { name: GATUS_URL, value: "http://gatus.watch.svc:8080" }
            - { name: ES_URL, value: "https://ops-logs-es-http.logging.svc:9200" }
            - { name: ES_AUTH_DIR, value: /es-reader }             # control-reader: role control_reader in logging/roles.yml
            - { name: NODE_EXTRA_CA_CERTS, value: /ca/ca.crt }     # the ops CA signed the ES http certificate
          ports:
            - { name: http, containerPort: 7443 }
          volumeMounts:
            - { name: token, mountPath: /secrets, readOnly: true }
            - { name: es-reader, mountPath: /es-reader, readOnly: true }
            - { name: ops-ca, mountPath: /ca, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: token
          secret: { secretName: control-agent-token }
        - name: es-reader
          secret: { secretName: control-es-reader, items: [{ key: username, path: username }, { key: password, path: password }] }
        - name: ops-ca
          configMap: { name: ops-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: control-agent
  namespace: control
spec:
  selector: { app: control-agent }
  ports:
    - { name: http, port: 7443, targetPort: http }
