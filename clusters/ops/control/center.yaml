# The center: holds the agents' streams, keeps the events in SQLite and serves the web app. Public only as
# control.hetops.dev through the hetops-3 tunnel (cloudflared in logging), behind the owner-only Access app; the
# center verifies the Access JWT itself as well, so nothing that skips Access gets past /healthz.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: control-data
  namespace: control
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-center
  namespace: control
spec:
  replicas: 1
  strategy: { type: Recreate }          # one SQLite file on a ReadWriteOnce volume: never two pods at once
  selector:
    matchLabels: { app: control-center }
  template:
    metadata:
      labels: { app: control-center }
    spec:
      automountServiceAccountToken: false   # the center never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001                      # the PVC is writable for 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: center
          # hetops-control main 4bf335ba7412c81acfcbb398338d634a3d757123
          image: ghcr.io/het101/hetops-control-center@sha256:08457c8e4fc19cc730e7b2199a287ed3c7035d0db7ead8170ee7d66e34b5953a
          env:
            # tokens come from files (Secret control-agent-tokens); the lab agent's certificate is signed by the ops CA
            - name: AGENTS
              value: >-
                [{"server":"ops","url":"http://control-agent.control.svc:7443","tokenFile":"/secrets/agents/ops"},
                {"server":"lab","url":"https://100.93.151.22:7443","tokenFile":"/secrets/agents/lab","caFile":"/ca/ca.crt"}]
            - { name: DB_PATH, value: /data/events.db }
            # the Cloudflare Access app "control": team domain and AUD tag, neither secret
            - { name: ACCESS_TEAM_DOMAIN, value: nameless-wave-c3ce.cloudflareaccess.com }
            - { name: ACCESS_AUD, value: 73f0b7ef7dc0c1b60aa91809120445ca123245fa707c9aa2847ec8044b1dff5a }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }      # SQLite falls back to /tmp for temporary files; the root is read-only
            - { name: tokens, mountPath: /secrets/agents, readOnly: true }
            - { name: ca, mountPath: /ca, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: control-data }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: tokens
          secret: { secretName: control-agent-tokens }
        - name: ca
          configMap: { name: ops-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: control-center
  namespace: control
spec:
  selector: { app: control-center }
  ports:
    - { name: http, port: 8080, targetPort: http }
