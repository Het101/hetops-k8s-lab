# Who may open a connection to HetOps Control's pods (defence in depth: the agent still wants its bearer token and the
# center an Access JWT). Ingress only; egress stays open: the agent calls the API server and the kubelet, the center
# calls the lab agent over the tailnet and Cloudflare for the Access keys. Calico lets the node's own kubelet probes in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-agent
  namespace: control
spec:
  podSelector:
    matchLabels: { app: control-agent }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: control-center }
      ports:
        - { protocol: TCP, port: 7443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-center
  namespace: control
spec:
  podSelector:
    matchLabels: { app: control-center }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:          # the tunnel: control.hetops.dev
            matchLabels: { kubernetes.io/metadata.name: logging }
          podSelector:
            matchLabels: { app: cloudflared }
        - namespaceSelector:          # Gatus's "HetOps Control" check
            matchLabels: { kubernetes.io/metadata.name: watch }
          podSelector:
            matchLabels: { app: gatus }
      ports:
        - { protocol: TCP, port: 8080 }
