# HetOps Control (stage 1a): the center (control.hetops.dev, behind Cloudflare Access) and this cluster's agent,
# from clusters/ops/control. The lab's agent is deployed by the lab's own Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: control
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Het101/hetops-k8s-lab.git
    targetRevision: main
    path: clusters/ops/control
  destination: { server: https://kubernetes.default.svc, namespace: control }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # a rebuild can sync this before the SealedSecret CRD exists; automated sync does not retry the same commit without this
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
